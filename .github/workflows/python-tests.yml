name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas numpy pytest
      - name: Compile Python files
        run: python -m compileall -q src app tests
      - name: Run unit tests
        run: python -m pytest -q
